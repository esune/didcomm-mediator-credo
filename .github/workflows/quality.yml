name: Quality

on:
  pull_request:
    branches:
      - main
      - live-mode-postgres
  push:
    branches:
      - main

jobs:
  postgres-pickup:
    runs-on: ubuntu-latest
    name: PostgreSQL Pickup
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pickup-test-password
          POSTGRES_DB: pickup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PICKUP_TEST_DATABASE_URL: postgres://postgres:pickup-test-password@localhost:5432/pickup_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/message-pickup-repository-pg/tests/claims.integration.test.ts

  validate:
    runs-on: ubuntu-latest
    name: Validate
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup NodeJS
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Style
        run: pnpm style:check

      - name: Check Types
        run: pnpm types:check

      - name: Compile
        run: pnpm build:all

  tests:
    runs-on: ubuntu-latest
    name: Tests

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup DynamoDB Local
        uses: rrainn/dynamodb-action@v4.0.0
        with:
          port: 8000
          cors: '*'

      - uses: pnpm/action-setup@v4

      - name: Setup NodeJS
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: pnpm cache path
        id: pnpm-cache-path
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache-path.outputs.STORE_PATH }}
          key: ${{ runner.os }}-${{ steps.setup-node.outputs.node-version }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.setup-node.outputs.node-version }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
